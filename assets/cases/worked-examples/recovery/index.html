<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>青岫器材 · 领用申请</title>
<style>
:root{color-scheme:light;--ink:#253741;--muted:#596b76;--line:#d7dfe4;--bg:#f2f4f5;--brand:#355b70;--danger:#993e2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button,input,a{ -webkit-tap-highlight-color:transparent}button{border:1px solid var(--brand);border-radius:6px;padding:11px 20px;background:var(--brand);color:#fff;cursor:pointer;min-height:46px;font-weight:600}button:hover:not(:disabled){background:#284a5d}button:disabled{cursor:default;opacity:.55}button.secondary{background:#fff;color:var(--brand)}:focus-visible{outline:3px solid #7f9daf;outline-offset:3px}a{color:var(--brand);text-underline-offset:3px}header{max-width:1080px;margin:auto;padding:25px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:650;letter-spacing:2px}.brand span{font-size:13px;letter-spacing:0;font-weight:400;margin-left:14px;color:var(--muted)}.header-note{font-size:13px;color:var(--muted)}main{max-width:1080px;margin:0 auto;padding:38px 24px 28px}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}h1{font-size:34px;line-height:1.3;letter-spacing:-.02em;margin:0 0 10px;font-weight:650}.intro p{margin:0;color:var(--muted)}.count{white-space:nowrap;font-size:14px;color:var(--muted);padding-bottom:3px}form{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.section{padding:28px 32px}.section+.section{border-top:1px solid var(--line)}h2{font-size:18px;margin:0 0 20px;font-weight:650}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}input{min-width:0;padding:10px 12px;border:1px solid #9faeb8;border-radius:5px;color:var(--ink);background:#fff;width:100%;height:46px}input[readonly]{background:#f2f5f6;border-color:#e0e6e9;color:#50636e}input[aria-invalid=true]{border-color:var(--danger);background:#fffaf8}.table-head,.delivery-row{display:grid;grid-template-columns:minmax(0,1.3fr) 120px minmax(0,1.1fr);gap:32px}.table-head{font-size:13px;color:var(--muted);padding:0 0 12px;border-bottom:1px solid var(--line)}.delivery-row{padding:22px 0;align-items:start;border-bottom:1px solid var(--line)}.delivery-row:last-child{border-bottom:0;padding-bottom:0}.item-label{display:flex;align-items:center;gap:14px}.item-icon{width:40px;height:40px;border-radius:7px;background:#edf2f4;display:grid;place-items:center;color:#526b7a;flex-shrink:0}.item-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5}.item-label label{display:block;font-weight:600}.item-id{display:block;font-size:12px;color:var(--muted);letter-spacing:.03em}.quantity{display:flex;align-items:center;gap:10px}.quantity input{width:82px;text-align:center;font-variant-numeric:tabular-nums}.unit{font-size:14px;color:var(--muted)}.feedback{min-width:0;padding-top:1px}.status{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}.status:before{content:"";width:6px;height:6px;flex-shrink:0;border-radius:100%;background:#9cabb4}.feedback p:empty{display:none}.feedback p{font-size:13px;color:var(--muted);margin:5px 0 0;overflow-wrap:anywhere}.delivery-row[data-state=done] .status{color:#32634e}.delivery-row[data-state=done] .status:before{background:#50836a}.delivery-row[data-state=invalid] .status{color:var(--danger)}.delivery-row[data-state=invalid] .status:before{background:var(--danger)}.delivery-row[data-state=pending] .status,.delivery-row[data-state=unknown] .status{color:#7d5d2e}.delivery-row[data-state=pending] .status:before,.delivery-row[data-state=unknown] .status:before{background:#a6834a}.recovery{padding:22px 32px;background:#f7f9fa;border-top:1px solid var(--line)}#error:empty{display:none}#error{font-size:14px;color:var(--danger);margin:0 0 14px}#error a{color:inherit}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#result{font-size:14px;color:var(--muted);margin-bottom:15px}#result strong{color:var(--ink)}#verify-note{font-size:13px;color:var(--muted);margin:12px 0 0;overflow-wrap:anywhere}#verify-note:empty{display:none}[hidden]{display:none!important}.receipt{padding:28px 32px}.receipt h2{font-size:23px;margin-bottom:5px}.receipt .contact{margin:0 0 22px;color:var(--muted);font-size:14px}.receipt ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}.receipt li{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}.receipt li span{color:var(--muted);font-size:14px}.receipt li strong{font-size:16px}.receipt .confirmed{color:#32634e;font-size:14px;margin:20px 0 0}footer{max-width:1080px;margin:auto;padding:0 24px 30px;font-size:12px;color:var(--muted)}@media(max-width:600px){header{padding:18px 20px}.brand{font-size:18px}.brand span,.header-note{display:none}main{padding:26px 16px 22px}.intro{margin-bottom:22px;display:block}h1{font-size:28px}.intro p{font-size:14px}.count{margin-top:12px}.section{padding:22px 20px}.contact-grid{grid-template-columns:1fr;gap:18px}h2{margin-bottom:18px}.table-head{display:none}.delivery-row{grid-template-columns:minmax(0,1fr) 108px;gap:12px 16px;padding:20px 0}.delivery-row:first-of-type{padding-top:0}.item-icon{width:34px;height:38px}.item-label{gap:10px}.quantity{justify-content:flex-end}.quantity input{width:72px}.feedback{grid-column:1/-1;padding-left:44px}.feedback p:empty{display:none}.feedback p{font-size:13px}.recovery,.receipt{padding:22px 20px}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}.receipt li{align-items:center}footer{padding-inline:20px}.receipt li span{display:block;font-size:12px}.receipt li strong{white-space:nowrap}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head>
<body><header><div class="brand">青岫器材<span>领用服务</span></div><div class="header-note">每一件，都有回执</div></header>
<main><div class="intro"><div><h1>器材领用申请</h1><p id="intro-copy">确认领用人和数量，提交后可逐项查看结果。</p></div><div class="count">本次共 3 种器材</div></div>
<form id="delivery" novalidate><div id="editing"><section class="section" aria-labelledby="contact-heading"><h2 id="contact-heading">领用信息</h2><div class="contact-grid"><div class="field"><label for="contact">领用人</label><input id="contact" name="contact" autocomplete="name" required value="陆汀"></div><div class="field"><label for="phone">联系电话</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required value="13700006666"></div></div></section>
<section class="section rows" aria-labelledby="items-heading"><h2 id="items-heading">本次领用</h2><div class="table-head" aria-hidden="true"><span>器材</span><span>领用数量</span><span>处理结果</span></div>
<div class="delivery-row" id="row-a"><div class="item-label"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v8m-4 9 4-9 4 9M6 21l6-10 6 10M9 5h6"/></svg></span><div><label for="qty-a">三脚架</label><span class="item-id">EQ-81</span></div></div><div class="quantity"><input id="qty-a" name="EQ-81" type="text" inputmode="numeric" aria-label="三脚架领用件数" aria-describedby="note-a" value="3"><span class="unit">件</span></div><div class="feedback"><span id="state-a" class="status">待提交</span><p id="note-a"></p></div></div>
<div class="delivery-row" id="row-b"><div class="item-label"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3m-4 0h8"/></svg></span><div><label for="qty-b">领夹话筒</label><span class="item-id">EQ-82</span></div></div><div class="quantity"><input id="qty-b" name="EQ-82" type="text" inputmode="numeric" aria-label="领夹话筒领用件数" aria-describedby="note-b" value="7"><span class="unit">件</span></div><div class="feedback"><span id="state-b" class="status">待提交</span><p id="note-b"></p></div></div>
<div class="delivery-row" id="row-c"><div class="item-label"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 13V9a6 6 0 0 1 12 0v4a6 6 0 0 1-12 0Z"/><path d="M9 20v2m6-2v2M9 7h6m-7 4h8m-7 4h6"/></svg></span><div><label for="qty-c">防风罩</label><span class="item-id">EQ-83</span></div></div><div class="quantity"><input id="qty-c" name="EQ-83" type="text" inputmode="numeric" aria-label="防风罩领用件数" aria-describedby="note-c" value="2"><span class="unit">件</span></div><div class="feedback"><span id="state-c" class="status">待提交</span><p id="note-c"></p></div></div></section></div>
<div class="recovery" id="recovery"><div id="error" role="alert"></div><div id="result" role="status" aria-live="polite">数量将以实际接纳结果为准。</div><div class="actions"><button type="submit" id="submit">提交领用申请</button><button type="button" class="secondary" id="verify" hidden>核实防风罩结果</button></div><p id="verify-note"></p></div>
<section id="receipt" class="receipt" aria-labelledby="receipt-heading" hidden tabindex="-1"><h2 id="receipt-heading">领用已全部接纳</h2><p class="contact" id="receipt-contact"></p><ul id="receipt-items"></ul><p class="confirmed">✓ 3 种器材均已确认</p></section></form></main><footer>合成领用演示 · 未连接真实器材库存</footer><script src="app.js"></script></body></html>
