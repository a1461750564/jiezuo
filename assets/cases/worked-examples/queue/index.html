<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>当班设施 · 榆岚巡检</title>
<style>
:root{color-scheme:light;--paper:#f1f2f0;--surface:#fafbf9;--ink:#283e4b;--muted:#53656f;--line:#c9d0d2;--accent:#476476;--soft:#e3eaed}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit}button,select{min-height:44px}button{cursor:pointer}button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #537c96;outline-offset:4px}button,select{-webkit-tap-highlight-color:transparent}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.site-header{max-width:1184px;margin:auto;padding:25px 32px 23px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-size:18px;letter-spacing:.08em}.brand-mark{display:grid;grid-template-columns:repeat(2,5px);gap:3px;padding:8px;border:1px solid var(--accent);border-radius:3px}.brand-mark i{width:5px;height:5px;background:var(--accent)}.header-note{font-size:13px;color:var(--muted);letter-spacing:.08em}
main{max-width:1184px;padding:0 32px;margin:auto}.intro{padding:32px 0 28px}.eyebrow{margin:0 0 9px;font-size:12px;letter-spacing:.12em;color:var(--muted)}h1{font:600 40px/1.3 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:.02em;margin:0 0 12px}.intro p:last-child{margin:0;font-size:15px;color:var(--muted)}
.queue-toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:19px}.queue-heading{display:flex;align-items:baseline;gap:13px}h2{font-size:20px;line-height:1.4;margin:0;font-weight:600}.result-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.filter-group{display:flex;align-items:center;gap:12px}.filter-caption{font-size:13px;color:var(--muted)}select{color:var(--ink);background:var(--surface);border:1px solid #aebcc3;border-radius:5px;padding:8px 36px 8px 13px;min-width:144px;cursor:pointer}
.column-head,article{display:grid;grid-template-columns:minmax(230px,2.2fr) minmax(76px,.7fr) minmax(230px,2.6fr) 90px 72px;column-gap:26px;align-items:center}.column-head{padding:12px 20px;background:#e5e9e8;border-top:1px solid #b8c3c7;border-bottom:1px solid #b8c3c7;font-size:12px;letter-spacing:.06em;color:#5c6d77}.column-head span:last-child{text-align:right}article{padding:24px 20px;border-bottom:1px solid var(--line);min-height:112px;transition:background .15s}article:hover{background:#e9edeb}article[hidden]{display:none}.facility{min-width:0}.record-id{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em;color:var(--muted)}h3{font-size:18px;line-height:1.6;font-weight:600;margin:5px 0 0;overflow-wrap:anywhere}article p{margin:0;font-size:15px}.owner{color:#405561}.mobile-label{display:none}.observation{line-height:1.85;overflow-wrap:anywhere}.record-status{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:14px;font-weight:500}.status-dot{width:6px;height:6px;border-radius:50%;background:#48697f;flex:none}.done{color:var(--muted);font-weight:400}.done .status-dot{background:#8c9d9d}.detail-button{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--surface);border:1px solid #b6c3ca;border-radius:5px;color:var(--accent);padding:7px 11px;font-size:14px;font-weight:500;white-space:nowrap}.detail-button:hover{background:var(--accent);border-color:var(--accent);color:white}.detail-button span{font-size:17px;line-height:1}.boundary{display:flex;align-items:center;gap:9px;padding:23px 0 30px;margin:0;font-size:12px;color:var(--muted)}.boundary::before{content:"";width:5px;height:5px;border:1px solid #86949d;flex:none;border-radius:50%}
#drawer{position:fixed;inset:0 0 0 auto;margin:0;height:100dvh;max-height:100dvh;width:520px;max-width:100%;padding:0;border:0;border-left:1px solid #b8c3c7;background:var(--surface);color:var(--ink);box-shadow:-14px 0 50px #23394616;overflow:auto}#drawer::backdrop{background:#1d303b66;backdrop-filter:blur(2px)}.drawer-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 30px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:1}.drawer-top p{margin:0;color:var(--muted);font-size:13px}#close{display:flex;align-items:center;gap:9px;border:1px solid transparent;background:transparent;color:var(--ink);padding:6px 0 6px 12px;font-size:14px;border-radius:4px}#close:hover{color:var(--accent);background:var(--soft)}#close span{font-size:23px;font-weight:300;line-height:1}.drawer-body{padding:30px}.detail-id{font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);letter-spacing:.04em;margin:0 0 12px}#detail-title{font-size:28px;line-height:1.55;letter-spacing:.01em;overflow-wrap:anywhere}#detail{margin-top:28px}.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:21px 0;margin:0;border-block:1px solid var(--line)}dt,.detail-section h3{font-size:12px;font-weight:400;color:var(--muted);margin:0 0 7px}dd{margin:0;font-size:16px}.detail-section{padding-top:28px}.detail-section h3{letter-spacing:.05em}.detail-section p{font-size:17px;line-height:1.9;margin:0;overflow-wrap:anywhere}.next-step{margin-top:28px;padding:18px 20px;background:#e9eef0;border-radius:4px}.next-step p{font-size:15px}.drawer-body>.boundary{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);line-height:1.8}
@media(max-width:1000px){.column-head,article{grid-template-columns:minmax(180px,1.7fr) 68px minmax(170px,2fr) 80px 72px;column-gap:16px}.site-header,main{padding-inline:24px}}
@media(max-width:760px){.site-header{padding:20px;border-bottom:1px solid var(--line)}.brand{font-size:16px;gap:9px}.brand-mark{padding:6px}.header-note{font-size:12px;letter-spacing:0}main{padding-inline:20px}.intro{padding:30px 0 28px}h1{font-size:34px;margin-bottom:9px}.intro p:last-child{font-size:14px}.eyebrow{font-size:12px;margin-bottom:7px}.queue-toolbar{align-items:center;padding-bottom:16px;gap:8px}.queue-heading{gap:8px}h2{font-size:18px}.result-count{font-size:12px}.filter-caption{display:none}select{min-width:122px;padding-right:27px;font-size:14px}.column-head{display:none}#queue{border-top:1px solid #aebdc4}article{grid-template-columns:minmax(0,1fr) auto;gap:15px 12px;padding:21px 0 22px;min-height:0}.facility{grid-column:1;grid-row:1}h3{font-size:18px;margin-top:5px;line-height:1.65}.record-status{grid-column:2;grid-row:1;align-self:start;margin-top:2px;font-size:13px;gap:6px;background:var(--soft);padding:3px 7px;border-radius:3px}.done{background:#e7ebe8}.observation{grid-column:1/-1;grid-row:2;font-size:15px;line-height:1.9;max-width:100%}.owner{grid-column:1;grid-row:3;font-size:14px;display:flex;gap:10px;align-items:center}.mobile-label{display:inline;font-size:12px;color:var(--muted)}.detail-button{grid-column:2;grid-row:3;padding-inline:14px;min-width:81px}.boundary{font-size:12px;align-items:flex-start;padding-top:22px}.boundary::before{margin-top:7px}#drawer{width:100%;border:0}.drawer-top{padding:14px 20px}.drawer-body{padding:25px 24px}#detail-title{font-size:25px}.detail-section p{font-size:16px}.drawer-body>.boundary{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="site-header"><b class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>榆岚巡检</b><span class="header-note">交接中的现场</span></header>
<main><div class="intro"><p class="eyebrow">当班交接</p><h1>当班设施</h1><p>查看观察与核实状态，再接着处理。</p></div>
<div class="queue-toolbar"><div class="queue-heading"><h2 id="queue-title">现场记录</h2><span id="result-count" class="result-count" aria-live="polite">4 条设施</span></div><div class="filter-group"><span class="filter-caption" aria-hidden="true">核实状态</span><label class="sr-only" for="filter">核实状态</label><select id="filter" name="status"><option value="all">全部设施</option><option value="pending">待复核</option><option value="done">已完成</option></select></div></div>
<section id="queue" aria-labelledby="queue-title"><div class="column-head" aria-hidden="true"><span>设施 / 编号</span><span>经办人</span><span>具体观察</span><span>核实状态</span><span>查看</span></div>
<article data-record="YL-203" data-state="pending" aria-labelledby="name-YL-203">
<div class="facility"><span class="record-id">YL-203</span><h3 id="name-YL-203">南门无障碍升降平台</h3></div>
<p class="owner"><span class="mobile-label">经办人</span>谢舟</p>
<p class="observation">开合两次后仍偶发卡住，现场保留原位</p>
<p class="record-status pending"><span class="status-dot" aria-hidden="true"></span>待复核</p>
<button id="open-YL-203" class="detail-button" data-open="YL-203" aria-label="查看南门无障碍升降平台详情">详情<span aria-hidden="true">→</span></button>
</article>
<article data-record="YL-204" data-state="done" aria-labelledby="name-YL-204">
<div class="facility"><span class="record-id">YL-204</span><h3 id="name-YL-204">通道照明</h3></div>
<p class="owner"><span class="mobile-label">经办人</span>许清</p>
<p class="observation">本轮亮灯检查已完成</p>
<p class="record-status done"><span class="status-dot" aria-hidden="true"></span>已完成</p>
<button id="open-YL-204" class="detail-button" data-open="YL-204" aria-label="查看通道照明详情">详情<span aria-hidden="true">→</span></button>
</article>
<article data-record="YL-205" data-state="pending" aria-labelledby="name-YL-205">
<div class="facility"><span class="record-id">YL-205</span><h3 id="name-YL-205">东侧雨棚排水口</h3></div>
<p class="owner"><span class="mobile-label">经办人</span>林遥</p>
<p class="observation">积水退去后仍需检查落叶堵点</p>
<p class="record-status pending"><span class="status-dot" aria-hidden="true"></span>待复核</p>
<button id="open-YL-205" class="detail-button" data-open="YL-205" aria-label="查看东侧雨棚排水口详情">详情<span aria-hidden="true">→</span></button>
</article>
<article data-record="YL-206" data-state="done" aria-labelledby="name-YL-206">
<div class="facility"><span class="record-id">YL-206</span><h3 id="name-YL-206">一层扶手接头</h3></div>
<p class="owner"><span class="mobile-label">经办人</span>韩昭</p>
<p class="observation">紧固检查完成并保留记录</p>
<p class="record-status done"><span class="status-dot" aria-hidden="true"></span>已完成</p>
<button id="open-YL-206" class="detail-button" data-open="YL-206" aria-label="查看一层扶手接头详情">详情<span aria-hidden="true">→</span></button>
</article>
</section><p class="boundary">合成巡检，未连接真实设施管理</p>
</main>
<dialog id="drawer" aria-labelledby="detail-title"><div class="drawer-top"><p>现场详情</p><button id="close" type="button"><span aria-hidden="true">×</span>关闭详情</button></div><div class="drawer-body"><p class="detail-id" id="detail-id"></p><h2 id="detail-title" tabindex="-1">现场详情</h2><div id="detail"></div><p class="boundary">合成巡检，未连接真实设施管理</p></div></dialog>
<script>
const records=[{"id":"YL-203","name":"南门无障碍升降平台","owner":"谢舟","note":"开合两次后仍偶发卡住，现场保留原位","state":"待复核"},{"id":"YL-204","name":"通道照明","owner":"许清","note":"本轮亮灯检查已完成","state":"已完成"},{"id":"YL-205","name":"东侧雨棚排水口","owner":"林遥","note":"积水退去后仍需检查落叶堵点","state":"待复核"},{"id":"YL-206","name":"一层扶手接头","owner":"韩昭","note":"紧固检查完成并保留记录","state":"已完成"}];
let origin;
const f=document.querySelector('#filter'),d=document.querySelector('#drawer');
function applyFilter(){let count=0;document.querySelectorAll('[data-record]').forEach(row=>{row.hidden=f.value!=='all'&&row.dataset.state!==f.value;if(!row.hidden)count++});document.querySelector('#result-count').textContent=count+' 条设施'}
function restoreFilter(){const v=new URL(location.href).searchParams.get('status');f.value=['pending','done'].includes(v)?v:'all';applyFilter()}
f.addEventListener('change',()=>{const u=new URL(location.href);f.value==='all'?u.searchParams.delete('status'):u.searchParams.set('status',f.value);history.replaceState(null,'',u);applyFilter()});
window.addEventListener('popstate',restoreFilter);restoreFilter();
function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>{origin=button;const r=records.find(record=>record.id===button.dataset.open);document.querySelector('#detail-id').textContent=r.id;document.querySelector('#detail-title').textContent=r.name;const meta=element('dl',undefined,'detail-meta');const owner=element('div');owner.append(element('dt','经办人'),element('dd',r.owner));const state=element('div');state.append(element('dt','核实状态'),element('dd',r.state));meta.append(owner,state);const observation=element('section',undefined,'detail-section');observation.append(element('h3','具体观察'),element('p',r.note));const next=element('section',undefined,'detail-section next-step');next.append(element('h3','下一步'),element('p','下一步核对原位与上次记录'));document.querySelector('#detail').replaceChildren(meta,observation,next);d.showModal();d.scrollTop=0;document.querySelector('#detail-title').focus()}));
document.querySelector('#close').addEventListener('click',()=>d.close());
d.addEventListener('close',()=>origin?.focus({preventScroll:true}));
</script>
</body></html>
